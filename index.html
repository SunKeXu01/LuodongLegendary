<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171813" />
    <title>泺栋传奇 · 云津渡</title>
  </head>
  <body>
    <main class="game-shell">
      <header class="titlebar">
        <div class="brand">
          <span class="seal">泺</span>
          <div>
            <h1>泺栋传奇</h1>
            <p>明中叶 · 湖广云津渡</p>
          </div>
        </div>
        <div class="chapter"><span>第一回</span>渡口风波</div>
        <button id="restart" class="restart" type="button">重新闯荡</button>
      </header>

      <section class="viewport">
        <div id="game-canvas" class="game-canvas" aria-label="云津渡游戏画面"></div>
        <div class="hud top-left">
          <div class="portrait">侠</div>
          <div class="vitals">
            <strong>青冥门少侠</strong>
            <div id="health-bar" class="health"><span></span></div>
            <small id="health-text">100 / 100</small>
          </div>
        </div>
        <aside class="quest-panel">
          <p class="label">当前任务</p>
          <h2>云津渡伏兵</h2>
          <p>沿石径向东，击退寒岭武氏爪牙。</p>
          <div class="quest-count"><span id="enemy-count">3</span> 名敌人尚存</div>
        </aside>
        <div class="currency"><span>◆</span> 碎银 <strong id="silver">0</strong></div>
        <div class="message-box">
          <span class="speaker">江湖见闻</span>
          <p id="message">载入云津渡……</p>
        </div>
        <div class="controls">
          <span><kbd>WASD</kbd> 移动</span>
          <span><kbd>空格 / J</kbd> 出招</span>
        </div>
        <button id="attack" class="attack" type="button"><span>斩</span>施展招式</button>
      </section>

      <footer class="choicebar">
        <div class="choice-group">
          <span>武学路数</span>
          <button class="choice active" type="button" data-martial="sword">青冥剑式</button>
          <button class="choice" type="button" data-martial="palm">伏虎掌</button>
          <button class="choice" type="button" data-martial="mechanism">机弩术</button>
        </div>
        <div class="choice-group story">
          <span>江湖抉择</span>
          <button class="choice active" type="button" data-story="protect-villagers">
            护送百姓
          </button>
          <button class="choice" type="button" data-story="seek-evidence">追查暗记</button>
        </div>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
