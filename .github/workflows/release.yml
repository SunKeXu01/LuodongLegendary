name: Build Godot Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download Godot 4.7.1 .NET and export templates
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools/godot | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_win64.zip" `
            -OutFile "tools/godot.zip"
          Expand-Archive "tools/godot.zip" -DestinationPath "tools/godot"

          Invoke-WebRequest `
            -Uri "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_export_templates.tpz" `
            -OutFile "tools/export-templates.zip"
          Expand-Archive "tools/export-templates.zip" -DestinationPath "tools/export-templates"
          $templateDir = "$env:APPDATA/Godot/export_templates/4.7.1.stable.mono"
          New-Item -ItemType Directory -Force $templateDir | Out-Null
          Copy-Item "tools/export-templates/templates/*" $templateDir -Recurse -Force

      - name: Build C# gameplay core
        run: dotnet build godot/LuodongLegendary.csproj --configuration Release

      - name: Validate Godot project
        shell: pwsh
        run: |
          $godot = Get-ChildItem "tools/godot" -Filter "*console.exe" -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          $validationOutput = & $godot --headless --path godot --editor --quit 2>&1 |
            Out-String
          Write-Host $validationOutput
          if (
            $LASTEXITCODE -ne 0 -or
            $validationOutput -match "SCRIPT ERROR|Failed to load script|Parse Error"
          ) {
            throw "Godot project validation found a script error."
          }

      - name: Run gameplay state smoke tests
        shell: pwsh
        run: |
          $godot = Get-ChildItem "tools/godot" -Filter "*console.exe" -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          $testOutput = & $godot --headless --path godot `
            res://tests/game_state_smoke.tscn 2>&1 | Out-String
          Write-Host $testOutput
          if (
            $LASTEXITCODE -ne 0 -or
            $testOutput -notmatch "GAMEPLAY STATE SMOKE TEST PASSED" -or
            $testOutput -match `
              "SCRIPT ERROR|Failed to load script|Parse Error|ObjectDB instances were leaked"
          ) {
            throw "Gameplay state smoke tests failed."
          }

      - name: Export Windows game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows | Out-Null
          $godot = Get-ChildItem "tools/godot" -Filter "*console.exe" -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          & $godot --headless --path godot --export-release `
            "Windows Desktop" "$PWD/build/windows/LuodongLegendary.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem build/windows

      - name: Smoke-test exported Windows game
        shell: pwsh
        run: |
          $gameOutput = & "$PWD/build/windows/LuodongLegendary.exe" `
            --headless --quit-after 5 2>&1 | Out-String
          Write-Host $gameOutput
          if (
            $LASTEXITCODE -ne 0 -or
            $gameOutput -match "SCRIPT ERROR|Failed to load script|Parse Error"
          ) {
            throw "The exported Windows game failed its startup smoke test."
          }

      - name: Create compressed installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=0.8.0" "installer/luodong-legendary.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: LuodongLegendary-Windows-x64-Installer
          path: release/*-setup.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 泺栋传奇 ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*-setup.exe
